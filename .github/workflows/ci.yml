name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  backend:
    name: Backend build & test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: medflow-ai-backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: medflow_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d medflow_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Check psql
        run: psql --version
      - name: Init test database
        run: bash ../scripts/db/init-test-db.sh "postgresql://postgres:postgres@localhost:5432/medflow_test"
      - run: dotnet restore
      - run: dotnet format whitespace MedFlow.slnx --verify-no-changes --no-restore
      - run: dotnet build --no-restore -c Release
      - run: dotnet test --no-build -c Release
        env:
          ConnectionStrings__DefaultConnection: Host=localhost;Port=5432;Database=medflow_test;Username=postgres;Password=postgres

  frontend:
    name: Frontend lint, build & test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: medflow-ai-frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: medflow-ai-frontend/package-lock.json
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run build
      - run: npm test
